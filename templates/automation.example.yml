# Browser automation — EXAMPLE (copy to candidate/automation.yml, which is gitignored).
#
# ON BY DEFAULT. Every capability below is on for every platform it applies to.
# Set a capability's `enabled` or a single platform to false to turn it off; a
# missing key means on. Turning one off is one command, and the agent tells you
# which switch is off and how to turn it back on.
#
# `capabilities_default: on` marks this file as written for the on-by-default
# contract. Keep it: without it, the capability values below are read as the old
# off default and everything reads as on.
#
# Safety checks that are not switches still apply: a capability only runs on the
# platforms it applies to, the agent halts on captcha / 2FA, application limits
# and comp-leak guards hold, and mail_access never sends, replies or deletes.
#
# NO STORED CREDENTIALS. CareerRat never stores your passwords. The browser session
# holds your logins. With `session.provider: auto`, CareerRat selects Orca inside an
# Orca workspace, otherwise CareerRat's app-owned Playwright browser. See
# docs/BROWSER.md and AGENTS.md → Browser Automation Contract.
#
# Don't hand-edit blindly — use the CLI (it validates + preserves these comments):
#   careerrat automation status                     show the full matrix
#   careerrat automation submit <auto|manual> --write      choose who presses the final Submit
#   careerrat automation disable <capability> [platform] --write   turn one off
#   careerrat automation enable <capability> [platform] --write    turn it back on

version: 1
capabilities_default: on

# ── Final submit ──────────────────────────────────────────────────────────────
# auto   = once the form is complete (no unresolved required fields, every required
#          attachment attached), the agent presses the final Submit once and checks
#          for the confirmation page. No confirmation page means "submitted but
#          unverified": it is never retried and never marked Applied.
# manual = fill and stop before Submit; a person presses it.
# Absent means auto. Any other value is an error. Change it with
# `careerrat automation submit <auto|manual> --write`.
submit: auto

# ── Capabilities ──────────────────────────────────────────────────────────────
# Each has a global `enabled` switch plus per-platform flags. All are on; set a
# switch to false to turn that capability, or just that platform, off.
capabilities:

  # Phase 1 — read-only application-status polling from your ATS dashboards.
  # The lowest-risk loop-closer: reads each application's status and hands
  # transitions to track-outcomes (still the only writer of tracker.json).
  status_polling:
    enabled: true
    platforms:
      greenhouse: true
      workday: true
      ashby: true
      lever: true

  # Phase 3 — read in-platform messages/DMs into communications[]. Highest ToS
  # exposure of the set, so it is the first one to turn off if you want less.
  messaging:
    enabled: true
    platforms:
      linkedin: true
      wellfound: true

  # Phase 4 — authenticated form preparation across supported ATS forms.
  # Fill and advance safely, halt on captcha / 2FA / application limits, and
  # follow the `submit` setting at the final submit control.
  authenticated_apply_preparation:
    enabled: true
    platforms:
      greenhouse: true
      lever: true
      ashby: true
      workable: true
      smartrecruiters: true
      linkedin: true
      external_ats: true

  # Phase 5 (M13) — LinkedIn profile optimizer. TWO separately-gated capabilities:
  # reading + suggesting profile rewrites is a different switch from writing them
  # back. profile_optimize is read-only (diffs your live profile against your
  # targeting + evidence and proposes honest rewrites); profile_apply lets the agent
  # write the approved edits back through the session browser, confirm-first PER
  # FIELD. The two switches are independent.
  profile_optimize:
    enabled: true
    platforms:
      linkedin: true

  profile_apply:
    enabled: true
    platforms:
      linkedin: true

  # Phase 6 (M17) — session webmail access. Separately gated from in-platform
  # messaging and Apple Mail ingest. `webmail` is provider-agnostic and only for
  # one recent verification-code message during apply/sign-in flows. Gmail/Outlook
  # are also supported for webmail recruiting ingest. Never send, delete,
  # reply, archive, mark read, or browse the broader inbox. Halt on mail login
  # wall / 2FA / captcha.
  mail_access:
    enabled: true
    platforms:
      gmail: true
      outlook: true
      webmail: true

  # Phase 7: relationship sourcing. Finds likely recruiters,
  # hiring-team members, or warm contacts for candidate review, then captures
  # reviewed leads into Network. Never sends messages or treats a found person
  # as an action path until the candidate approves the lead.
  relationship_sourcing:
    enabled: true
    platforms:
      linkedin: true
      wellfound: true

  # Phase 8 — confirm-first calendar provider sync. Builds on the no-auth
  # Calendar export path, but real provider writes stay behind their own gates.
  # Never writes on a schedule; every event/provider write needs a fresh user
  # request and confirmation.
  calendar_sync:
    enabled: true
    platforms:
      apple_calendar: true
      google_calendar: true
      outlook_calendar: true
      automation_tools: true

  # Phase 8 — read-only free/busy ingestion. Lets CareerRat see your existing
  # commitments so it schedules interviews around them and renders "busy" blocks
  # on the Calendar. Busy times are stored OPAQUE — start/end only, no titles or
  # attendees. work_calendar = a work calendar open in your session browser
  # (e.g. via the Chrome extension); apple/google/outlook = personal calendars.
  calendar_read:
    enabled: true
    platforms:
      work_calendar: true
      apple_calendar: true
      google_calendar: true
      outlook_calendar: true

# ── Session browser (tool-agnostic) ───────────────────────────────────────────
# provider: auto (recommended; Orca in Orca, CareerRat's own Playwright browser otherwise) |
# extension (holds your logins) | orca (supervised embedded browser) |
# playwright (persistent profile you log into once per platform).
# profile_root null = ~/.careerrat/board-profiles
session:
  provider: auto
  profile_root: null
