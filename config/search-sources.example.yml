# CareerRat search-source configuration — EXAMPLE / TEMPLATE.
#
# CareerRat ships NO role, geography, or company defaults. Copy this file to
# config/search-sources.yml (gitignored) and replace every placeholder below with
# YOUR OWN targets. The values here are illustrative placeholders, not recommendations.

title_filter:
  positive:
    - "Your Target Title"
    - "A Secondary Target Title"
  negative:
    - "A Role Type To Exclude"
  below_target:
    - "A Lower-Level Title To Skip"
  seniority_basis: "candidate-ladder"

location_filter:
  always_allow:
    - "Your Country"
  allow:
    - "Remote"
    - "Your Country"
  block:
    - "A Region To Exclude"

searches:
  - provider: "HiringCafe"
    source_type: "url-query"
    label: "Your Target Role"
    query: "your target role keywords"
    enabled: true
    recency:
      mode: "since-last-run"
      safetyMinutes: 30
    searchState:
      sortBy: "date"
  - provider: "HiringCafe"
    source_type: "url-query"
    label: "A Secondary Search"
    query: "another set of keywords"
    enabled: true
    recency:
      mode: "since-last-run"
      safetyMinutes: 30
    searchState:
      sortBy: "date"
  - provider: "RemoteVibeCodingJobs"
    source_type: "url-query"
    label: "Remote board (RSS example)"
    query: "your keywords"
    rssUrl: "https://remotevibecodingjobs.com/feed.xml"
    enabled: true
    notes: "Next.js job board with RSS, query search, tech/culture paths, and source labels from boards like Jobicy, LinkedIn, Greenhouse, Ashby, RemoteOK, and Google Jobs."

  # Wellfound (formerly AngelList Talent) — startup/tech job marketplace.
  # Auto-seeded for tech domains only (isTechDomain gate). Any domain can add manually.
  # URL format is path-based (not query-param): /role/r/{slug} (remote), /role/l/{slug}/{loc}, /role/{slug}.
  # Requires browser/Playwright — plain HTTP fetch returns 403.
  - provider: "Wellfound"
    source_type: "browser"
    label: "Wellfound"
    url: "https://wellfound.com/role/r/your-role-slug"
    enabled: true

  # Lever ATS — per-company job board. Auto-seeded from targeting.tracked_companies.
  # Board URL  : https://jobs.lever.co/{company-slug}      (human-facing, SPA)
  # JSON API   : https://api.lever.co/v0/postings/{company-slug}?mode=json  (set json: true)
  # Slug may differ from company display name — verify by visiting the board URL.
  - provider: "Lever"
    source_type: "ats"
    label: "Lever – acme"
    url: "https://jobs.lever.co/acme"
    enabled: true

  # Board-wide aggregator feeds — unauthenticated, whole-board JSON feeds (not
  # scoped to one company or one saved search). scanBoards() (sourced-scanner.mjs)
  # fetches every enabled source_type:"board" entry whose `provider` has a fetcher
  # in BOARD_PROVIDERS, then applies title_filter/location_filter above the same
  # as any other lane. Auto-seeded for EVERY domain (buildSearchSources) so a
  # fresh install always has at least one working deterministic source — enabled
  # by default only when candidate.domain is a tech domain, or (when domain is
  # absent/empty) a majority of the candidate's own targeting titles look
  # tech-shaped — present-but-disabled otherwise so any domain can flip one on.
  # Only these three providers are wired today; "Jobicy" and "We Work Remotely"
  # below in source_catalog.remote_boards are reference labels only — no
  # fetcher exists for them yet. `enabled_reason: "domain-gate"` marks these as
  # machine-set by that gate (not a manual edit) so a later regeneration can
  # re-sync `enabled` instead of a stale value shadowing it forever — remove
  # the property if you hand-toggle one of these to opt it out of re-sync.
  - provider: "remoteok"
    source_type: "board"
    label: "RemoteOK"
    url: "https://remoteok.com/api"
    enabled: true
    enabled_reason: "domain-gate"
  - provider: "remotive"
    source_type: "board"
    label: "Remotive"
    url: "https://remotive.com/api/remote-jobs"
    enabled: true
    enabled_reason: "domain-gate"
  - provider: "workingnomads"
    source_type: "board"
    label: "Working Nomads"
    url: "https://www.workingnomads.com/api/exposed_jobs/"
    enabled: true
    enabled_reason: "domain-gate"

tracked_companies: []

source_catalog:
  aggregators:
    - "HiringCafe"
    - "RemoteVibeCodingJobs"
    - "Wellfound"
    - "LinkedIn"
    - "Google Jobs"
  ats:
    - "Ashby"
    - "Greenhouse"
    - "Lever"
    - "Workable"
    - "SmartRecruiters"
    - "Recruitee"
    - "Workday"
  remote_boards:
    - "RemoteOK"
    - "Jobicy"
    - "Working Nomads"
    - "We Work Remotely"
    - "Remotive"
