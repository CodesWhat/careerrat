name: publish

# Publishes careerrat to npm when a GitHub Release is published (or run manually).
#
# Auth: npm Trusted Publishing (OIDC) — NO token is stored. npm trusts this exact
# workflow via the trusted-publisher connection configured on the package
# (Settings → Trusted Publisher: GitHub Actions → CodesWhat/careerrat → publish.yml,
# permission "npm publish"). The job mints a short-lived credential from GitHub's
# OIDC token at run time, so there is nothing to rotate or leak. If you ever rename
# this file or move the repo, update the trusted-publisher connection to match.
#
# Each release: bump package.json "version" first. npm rejects republishing an
# existing version, so the release tag must be a new version (0.1.0 is already live).
#
# Dist-tags: a prerelease version (any version containing "-", e.g. 0.2.0-rc.1) is
# published to the "rc" dist-tag, so `npm i careerrat` / `npm pack careerrat@latest`
# stay on the last stable release while testers opt in with `careerrat@rc`. A plain
# version (0.2.0) publishes to "latest" as usual. Mark the GitHub Release as a
# pre-release when cutting an -rc build for clarity (the trigger fires either way).
#
# Provenance: Trusted Publishing generates a signed provenance attestation
# automatically, so the npm package page shows "Built and signed on GitHub Actions"
# linking back to this repo.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  npm-publish:
    name: publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout and exact published-release/feed verification
      id-token: write # npm Trusted Publishing OIDC credential and provenance
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout, exact-release/feed verification, dependency install, and
          # the provenance publish (Trusted Publishing/OIDC): api.github.com
          # resolves the release, registry.npmjs.org handles the publish, and
          # fulcio.sigstore.dev plus rekor.sigstore.dev handle provenance
          # signing and transparency. The original publish set was observed
          # on run 32488752323; the release gate adds GitHub's API host.
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # A publish workflow must not restore a shared dependency cache: a
          # poisoned cache entry could reach the published npm artifact.
          package-manager-cache: false
      - name: Activate the repository-pinned npm release
        run: |
          set -euo pipefail
          EXPECTED_NPM="$(node -p "require('./package.json').packageManager")"
          if ! printf '%s' "$EXPECTED_NPM" | grep -Eq '^npm@[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::packageManager must pin an exact npm version, found '$EXPECTED_NPM'."
            exit 1
          fi
          actual_npm="npm@$(corepack npm --version)"
          if [ "$actual_npm" != "$EXPECTED_NPM" ]; then
            echo "::error::Corepack activated $actual_npm instead of $EXPECTED_NPM."
            exit 1
          fi
      - name: Assert the release tag matches the package version
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::npm publishing must run from a release tag, not $REF_TYPE/$REF_NAME."
            exit 1
          fi
          pkg_tag="v$(node -p "require('./package.json').version")"
          if [ "$pkg_tag" != "$REF_NAME" ]; then
            echo "::error::Release ref $REF_NAME does not match package.json ($pkg_tag)."
            exit 1
          fi
      - name: Verify the exact published release and Mac update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          matches="$(gh api "repos/$REPO/releases" --paginate --slurp | jq -c --arg tag "$REF_NAME" \
            'add | [.[] | select(.tag_name==$tag)]')"
          count="$(jq 'length' <<<"$matches")"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one GitHub release for $REF_NAME, found $count."
            exit 1
          fi

          release="$(jq '.[0]' <<<"$matches")"
          if ! jq -e '.draft == false and .published_at != null' <<<"$release" >/dev/null; then
            echo "::error::Release $REF_NAME is not published; refusing to publish npm first."
            exit 1
          fi

          version="${REF_NAME#v}"
          matching_dmgs=()
          matching_zips=()
          manifest_count=0
          while IFS= read -r asset; do
            if [[ "$asset" == CareerRat-"$version"-*.dmg || "$asset" == CareerRat-"$version".dmg ]]; then
              matching_dmgs+=("$asset")
            fi
            if [[ "$asset" == CareerRat-"$version"-*.zip || "$asset" == CareerRat-"$version".zip ]]; then
              matching_zips+=("$asset")
            fi
            if [ "$asset" = "latest-mac.yml" ]; then
              manifest_count=$((manifest_count + 1))
            fi
          done < <(jq -r '.assets[].name' <<<"$release")
          if [ "${#matching_dmgs[@]}" -ne 1 ]; then
            echo "::error::Release $REF_NAME must have exactly one .dmg asset matching version $version; found ${#matching_dmgs[@]}."
            exit 1
          fi
          if [ "${#matching_zips[@]}" -ne 1 ]; then
            echo "::error::Release $REF_NAME must have exactly one updater .zip asset matching version $version; found ${#matching_zips[@]}."
            exit 1
          fi
          if [ "$manifest_count" -ne 1 ]; then
            echo "::error::Release $REF_NAME must have exactly one latest-mac.yml asset; found $manifest_count."
            exit 1
          fi
          echo "Release feed gate passed with ${matching_dmgs[0]}, ${matching_zips[0]}, and latest-mac.yml."
      - name: Install locked dependencies
        run: corepack npm ci
      - name: Publish to npm (unscoped, public, trusted publishing)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then TAG=rc; else TAG=latest; fi
          echo "Publishing v$VERSION to dist-tag: $TAG"
          corepack npm publish --provenance --access public --tag "$TAG"
