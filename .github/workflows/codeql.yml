name: codeql

# CodeQL code scanning (free on public repos). Results land in the repo's Security →
# Code scanning tab. This is the "advanced setup" (a custom workflow), so do NOT also
# enable CodeQL default setup in the UI — they conflict.
#
# This runs scanning but does NOT gate merges: the ruleset deliberately does not (yet)
# carry a `code_scanning` rule, so first-run alerts won't block PRs. Once the baseline
# is clean, a `code_scanning` rule can be added to the Main branch protection ruleset.

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # checkout, CodeQL bundle download (release-assets.githubusercontent.com
          # via a github.com redirect), and SARIF upload (api.github.com,
          # uploads.github.com). Observed on run 32512881145 (Stable baseline,
          # 213 runs since the endpoint set last changed).
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
