name: codeql

# CodeQL code scanning (free on public repos). Results land in the repo's Security →
# Code scanning tab. This is the "advanced setup" (a custom workflow), so do NOT also
# enable CodeQL default setup in the UI — they conflict.
#
# This runs scanning but does NOT gate merges: the ruleset deliberately does not (yet)
# carry a `code_scanning` rule, so first-run alerts won't block PRs. Once the baseline
# is clean, a `code_scanning` rule can be added to the Main branch protection ruleset.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
