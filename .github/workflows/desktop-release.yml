name: desktop-release

# Fully automated desktop release pipeline. Pushing a tag `vX.Y.Z` builds the
# macOS and Windows apps from the exact tag. The DMG is always signed and
# notarized. Windows is attached only after SignPath returns a valid
# Authenticode signature; until Foundation approval/configuration exists, the
# unsigned installer remains a clearly labeled Actions-only QA artifact.
#
# The Homebrew cask is NOT updated from here. CodesWhat/homebrew-tap carries
# its own update-careerrat-cask.yml (cron + dispatch) that watches the latest
# published release and commits the cask bump to its own main with its own
# GITHUB_TOKEN (the same way the goreleaser-managed casks land there), so no
# cross-repo credential ever lives in this repo's secrets.
#
# workflow_dispatch backfills the LATEST vX.Y.Z tag (e.g. re-running after a
# secrets fix) without requiring a new tag push. It takes no inputs, matching
# release-assets.yml's dispatch and the checkov CKV_GHA_7 rule the qlty gate
# enforces; a dispatch always targets the newest tag by semver order.
#
# Every tag value is resolved once in `resolve-tag` and threaded through the
# other jobs as a job output / env var, never spliced directly into a `run:`
# script body — that's the template-injection pattern zizmor flags.
#
# Events created with a workflow's GITHUB_TOKEN do not start other workflows.
# `publish-release` therefore dispatches publish.yml, release-assets.yml, and
# sbom.yml explicitly after the release is published with its DMG attached,
# then waits for all three runs and propagates any failure. GitHub makes
# workflow_dispatch the explicit exception to that suppression, so this stays
# automatic without a PAT or GitHub App credential.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve-tag:
    name: resolve tag
    runs-on: ubuntu-latest
    # contents: read, not {}: the dispatch path reads the repo's tag list,
    # same class of read release-assets.yml grants for its dispatch fallback.
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # This job only calls `gh api repos/.../tags` (dispatch path) and
          # queries GitHub's tag-check API; observed on runs 32487926861 and
          # 32487059880 (endpoint-called: api.github.com, process: gh).
          allowed-endpoints: >
            api.github.com:443
      - name: Resolve the release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$(gh api "repos/$REPO/tags" --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Resolved tag '$tag' does not match vX.Y.Z"
            exit 1
          fi
          TAG="$tag"
          tag_ref="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
          if [ "$(jq -r '.object.type' <<<"$tag_ref")" != "tag" ]; then
            echo "::error::Release tag $TAG is lightweight; a signed annotated tag is required."
            exit 1
          fi
          tag_object="$(jq -er '.object.sha' <<<"$tag_ref")"
          tag_record="$(gh api "repos/$REPO/git/tags/$tag_object")"
          recorded_tag="$(jq -r '.tag' <<<"$tag_record")"
          if [ "$recorded_tag" != "$TAG" ]; then
            echo "::error::Release ref $TAG points to an annotated tag named $recorded_tag."
            exit 1
          fi
          target_type="$(jq -r '.object.type' <<<"$tag_record")"
          if [ "$target_type" != "commit" ]; then
            echo "::error::Release tag $TAG must point directly to one commit, not $target_type."
            exit 1
          fi
          tag_commit="$(jq -er '.object.sha' <<<"$tag_record")"
          verified="$(jq -r '.verification.verified' <<<"$tag_record")"
          reason="$(jq -r '.verification.reason' <<<"$tag_record")"
          if [ "$verified" != "true" ] || [ "$reason" != "valid" ]; then
            echo "::error::Release tag $TAG has no valid cryptographic signature (reason: $reason)."
            exit 1
          fi
          main_relation="$(gh api "repos/$REPO/compare/$tag_commit...main" --jq '.status')"
          if [ "$main_relation" != "ahead" ] && [ "$main_relation" != "identical" ]; then
            echo "::error::Release tag $TAG does not point to a commit reachable from protected main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  prepare-draft-release:
    name: prepare draft release
    needs: resolve-tag
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.draft-release.outputs.release-id }}
    permissions:
      contents: write # create or inspect the one immutable draft for this tag
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - name: Create or reuse exactly one draft release
        id: draft-release
        run: |
          set -euo pipefail
          policy_note="Code signing policy: https://github.com/$REPO/blob/$TAG/docs/CODE_SIGNING_POLICY.md"
          matches="$(gh api "repos/$REPO/releases" --paginate --slurp | jq -c --arg tag "$TAG" \
            'add | [.[] | select(.tag_name==$tag)]')"
          count="$(jq 'length' <<<"$matches")"
          if [ "$count" -gt 1 ]; then
            echo "::error::Found $count releases for tag $TAG; refusing to choose one."
            exit 1
          elif [ "$count" -eq 1 ]; then
            if [ "$(jq -r '.[0].draft' <<<"$matches")" != "true" ]; then
              echo "::error::Release $TAG is already published, not a draft; refusing to replace public assets."
              exit 1
            fi
            release_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"$matches")"
            existing_body="$(jq -r '.[0].body // ""' <<<"$matches")"
            if ! grep -Fq "$policy_note" <<<"$existing_body"; then
              if [ -n "$existing_body" ]; then
                updated_body="$(printf '%s\n\n%s' "$existing_body" "$policy_note")"
              else
                updated_body="$policy_note"
              fi
              gh api -X PATCH "repos/$REPO/releases/$release_id" -f body="$updated_body" >/dev/null
            fi
            echo "Draft release $TAG already exists."
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --generate-notes \
              --notes "$policy_note"
          fi
          final_matches="$(gh api "repos/$REPO/releases" --paginate --slurp | jq -c --arg tag "$TAG" \
            'add | [.[] | select(.tag_name==$tag)]')"
          if [ "$(jq 'length' <<<"$final_matches")" -ne 1 ] || \
            [ "$(jq -r '.[0].draft' <<<"$final_matches")" != "true" ]; then
            echo "::error::Release $TAG is not one exact draft after preparation."
            exit 1
          fi
          final_body="$(jq -r '.[0].body // ""' <<<"$final_matches")"
          if ! grep -Fq "$policy_note" <<<"$final_body"; then
            echo "::error::Draft release $TAG is missing its Code signing policy link."
            exit 1
          fi
          release_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"$final_matches")"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build-notarize-upload:
    name: build, notarize, upload dmg
    needs: [resolve-tag, prepare-draft-release]
    # Pinned arm64 image. macos-14 entered deprecation on 2026-07-06 and can
    # brown out before its 2026-11-02 retirement; macos-15 is its supported
    # arm64 replacement and matches the package's arm64-only target.
    runs-on: macos-15
    permissions:
      contents: write # create the draft release and upload its signed DMG
    # GH_TOKEN is deliberately NOT job-level env here: electron-builder
    # auto-activates its own GitHub publishing whenever it sees GH_TOKEN or
    # GITHUB_TOKEN (app-builder-lib PublishManager), then fails trying to
    # detect the repository. Only the steps that actually talk to GitHub get
    # it, and the electron-builder build never does.
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Stays on audit: this job's notarytool/stapler calls hit
          # Apple/Akamai/S3 hosts (appstoreconnect.apple.com,
          # notary-submissions-prod.s3-accelerate.amazonaws.com,
          # notary-artifacts-prod.s3.amazonaws.com, ocsp2.apple.com, and a
          # rotating *.akamaiedge.net edge like e2490.dscb.akamaiedge.net
          # observed on run 32487926861) that vary by Akamai edge assignment
          # run to run. A missed or rotated notarization endpoint fails a
          # release mid-flight, so `block` here needs a wider, verified
          # allowlist (or the *.apple.com / *.akamaiedge.net / *.aaplimg.com
          # wildcard form) before flipping, not a guess from one run's edge
          # node. house target is `block` once that's verified.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # This job signs, notarizes, and uploads a release artifact; a
          # poisoned shared dependency cache must never be able to reach it.
          # Same fix as publish.yml's setup-node step.
          package-manager-cache: false
      - name: Assert the tag matches the desktop package version
        # release-upload.mjs derives its upload target from package.json, not
        # from the pushed tag. If the two diverge, the upload would clobber a
        # different release's assets; refuse before the expensive build runs.
        run: |
          set -euo pipefail
          pkg_tag="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$pkg_tag" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match apps/desktop/package.json ($pkg_tag); refusing to build."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build and stage the app without signing credentials
        run: npm run app:build && npm --workspace apps/desktop run stage
      - name: Verify required signing and notarization secrets are set
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CSC_LINK:-}" ] || missing+=("CSC_LINK")
          [ -n "${CSC_KEY_PASSWORD:-}" ] || missing+=("CSC_KEY_PASSWORD")
          [ -n "${APPLE_API_KEY:-}" ] || missing+=("APPLE_API_KEY")
          [ -n "${APPLE_API_KEY_ID:-}" ] || missing+=("APPLE_API_KEY_ID")
          [ -n "${APPLE_API_ISSUER:-}" ] || missing+=("APPLE_API_ISSUER")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required secrets for the desktop release pipeline: %s\n' "${missing[*]}"
            echo "::error::See docs/RELEASE.md's 'One-time CI signing setup' section to add them."
            exit 1
          fi
          echo "Required signing and notarization secrets are present."
      - name: Write the App Store Connect API key to a runner-temp file
        id: apple-key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "key-path=$key_path" >> "$GITHUB_OUTPUT"
      - name: Import the signing identity into a persistent keychain
        # electron-builder imports CSC_LINK into a temporary keychain and
        # deletes it when its process exits (removeKeychain is registered
        # unconditionally in app-builder-lib; no env var prevents it).
        # release-dmg.mjs then codesigns the DMG container from a separate
        # process, so the identity must also live in a keychain that
        # survives. This one does, and sits in the user search list so
        # codesign resolves the identity by name.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/desktop-release.keychain-db"
          kc_pass="$(openssl rand -base64 24)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/signing-cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/signing-cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" -s -k "$kc_pass" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | sed 's/[" ]//g' | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          rm -f "$RUNNER_TEMP/signing-cert.p12"
      - name: Build and notarize the app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.apple-key.outputs.key-path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm --workspace apps/desktop run package:mac
      - name: Sign, notarize, and staple the DMG
        env:
          APPLE_API_KEY: ${{ steps.apple-key.outputs.key-path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm --workspace apps/desktop run release:dmg
      - name: Remove signing material from the runner
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/apple-api-key.p8"
          rm -f "$RUNNER_TEMP/signing-cert.p12"
          security delete-keychain "$RUNNER_TEMP/desktop-release.keychain-db" 2>/dev/null || true
      - name: Verify the signed and notarized release
        run: npm --workspace apps/desktop run verify:release
      - name: Launch the exact signed packaged app
        run: npm --workspace apps/desktop run verify:packaged
      - name: Upload the dmg to the release
        env:
          CAREERRAT_RELEASE_ID: ${{ needs.prepare-draft-release.outputs.release-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm --workspace apps/desktop run release:upload

  build-windows-upload:
    name: build, verify, and conditionally sign Windows
    needs: [resolve-tag, prepare-draft-release]
    runs-on: windows-latest
    permissions:
      actions: read # submit the workflow artifact id to the pinned SignPath action
      contents: write # attach only the Authenticode-verified result to the draft
    outputs:
      published: ${{ steps.windows-result.outputs.published }}
    env:
      EXPECTED_RELEASE_ID: ${{ needs.prepare-draft-release.outputs.release-id }}
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      VERSION: ${{ needs.resolve-tag.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - name: Harden the runner (audit dependency, browser, and signing endpoints)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Assert the tag matches the desktop package version
        shell: pwsh
        run: |
          $expected = "v$((Get-Content apps/desktop/package.json | ConvertFrom-Json).version)"
          if ($env:TAG -ne $expected) { throw "Tag $env:TAG does not match $expected" }
          "VERSION=$($env:TAG.TrimStart('v'))" | Out-File $env:GITHUB_ENV -Append
      - name: Build the unsigned Windows x64 NSIS installer
        run: npm run dist:windows --workspace apps/desktop
      - name: Install, mount, export PDF, launch Chromium, and uninstall
        run: npm run verify:windows --workspace apps/desktop
      - name: Upload the unsigned QA input for provenance and optional signing
        id: unsigned-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: careerrat-${{ needs.resolve-tag.outputs.tag }}-windows-x64-unsigned-qa
          path: apps/desktop/dist/CareerRat-*-win-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Submit the installer to SignPath Foundation
        id: sign-windows
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_CREDENTIAL }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          parameters: |
            version: ${{ toJSON(env.VERSION) }}
          output-artifact-directory: apps/desktop/dist/signpath-signed
      - name: Verify the signed Windows installer
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $expected = "CareerRat-$env:VERSION-win-x64-Setup.exe"
          $signed = Get-ChildItem apps/desktop/dist/signpath-signed -Recurse -File -Filter $expected
          if ($signed.Count -ne 1) { throw "Expected one signed $expected, found $($signed.Count)" }
          $destination = Join-Path apps/desktop/dist $expected
          Copy-Item $signed.FullName $destination -Force
          $signature = Get-AuthenticodeSignature $destination
          if ($signature.Status -ne 'Valid') { throw "Authenticode status is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notlike '*SignPath Foundation*') {
            throw "Unexpected signer: $($signature.SignerCertificate.Subject)"
          }
          npm run verify:windows --workspace apps/desktop
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "apps/desktop/dist/CareerRat-$env:VERSION-win-x64-SHA256.txt"
          "$hash  $expected" | Set-Content $checksum -Encoding ascii
      - name: Upload the verified signed Windows installer
        id: signed-windows
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $expected = "CareerRat-$env:VERSION-win-x64-Setup.exe"
          $destination = "apps/desktop/dist/$expected"
          $checksum = "apps/desktop/dist/CareerRat-$env:VERSION-win-x64-SHA256.txt"
          if (-not (Test-Path $destination) -or -not (Test-Path $checksum)) {
            throw "Verified signed Windows release assets are missing"
          }
          function Assert-DraftRelease {
            $json = (& gh api "repos/$env:REPO/releases" --paginate --slurp | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "Could not revalidate release $env:TAG" }
            $pages = ConvertFrom-Json -InputObject $json
            $releases = @($pages | ForEach-Object { $_ })
            $matches = @($releases | Where-Object { $_.tag_name -eq $env:TAG })
            if ($matches.Count -ne 1) {
              throw "Expected one release for $env:TAG, found $($matches.Count)"
            }
            $release = $matches[0]
            if ($release.draft -ne $true) { throw "Release $env:TAG is no longer a draft" }
            if ([string]$release.id -ne $env:EXPECTED_RELEASE_ID) {
              throw "Release identity changed from $env:EXPECTED_RELEASE_ID to $($release.id)"
            }
          }
          foreach ($asset in @($destination, $checksum)) {
            Assert-DraftRelease
            & gh release upload $env:TAG $asset --repo $env:REPO
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $asset to draft $env:TAG" }
          }
      - name: Record Windows publication state
        id: windows-result
        shell: pwsh
        env:
          SIGNED_WINDOWS_OUTCOME: ${{ steps.signed-windows.outcome }}
        run: |
          if ($env:SIGNED_WINDOWS_OUTCOME -eq 'success') {
            'published=true' | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            'published=false' | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host 'SignPath is not configured yet. The unsigned installer remains an Actions-only QA artifact.'
          }

  publish-release:
    name: publish release
    needs: [resolve-tag, prepare-draft-release, build-notarize-upload, build-windows-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the gated release after the DMG upload
      # Required only for the explicit workflow_dispatch calls below. GitHub
      # suppresses release-event workflows when the publishing API call uses
      # GITHUB_TOKEN, while workflow_dispatch is allowed to start them.
      actions: write # dispatch the three post-release workflows
      # gh run watch reads each dispatched run's check suite before returning
      # its final exit status to this job.
      checks: read # propagate each dispatched workflow's final check status
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      EXPECTED_RELEASE_ID: ${{ needs.prepare-draft-release.outputs.release-id }}
      WINDOWS_PUBLISHED: ${{ needs.build-windows-upload.outputs.published }}
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # Release lookup/publication plus workflow dispatch and child-run
          # status checks all use GitHub's API through gh. The release calls
          # were observed on run 32487926861; dispatch/watch adds API paths on
          # the same host without widening the egress allowlist.
          allowed-endpoints: >
            api.github.com:443
      - name: Publish the release once the dmg asset is confirmed
        # Resolved by release ID via the list API, not `gh release view TAG`:
        # a draft release is not addressable by tag through the tag-lookup
        # endpoint, and whether gh's draft fallback kicks in varies by gh
        # version (it differed between the macos and ubuntu runners on this
        # workflow's first live run, run 32487926861).
        # `--slurp` piped to the real jq for the same reasons as the
        # ensure-release step: gh's `--jq` runs per page, which breaks
        # aggregate filters past 100 releases.
        run: |
          set -euo pipefail
          matches="$(gh api "repos/$REPO/releases" --paginate --slurp | jq -c --arg tag "$TAG" \
            'add | [.[] | select(.tag_name==$tag)]')"
          count="$(jq 'length' <<<"$matches")"
          if [ "$count" -eq 0 ]; then
            echo "::error::No release found for $TAG after build-notarize-upload; refusing to publish blind."
            exit 1
          elif [ "$count" -gt 1 ]; then
            echo "::error::Found $count releases for tag $TAG; refusing to guess which to publish."
            exit 1
          fi
          listed_release_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"$matches")"
          if [ "$listed_release_id" != "$EXPECTED_RELEASE_ID" ]; then
            echo "::error::Release identity changed from $EXPECTED_RELEASE_ID to $listed_release_id; refusing to publish."
            exit 1
          fi
          release="$(gh api "repos/$REPO/releases/$EXPECTED_RELEASE_ID")"
          if [ "$(jq -r '.tag_name' <<<"$release")" != "$TAG" ] || \
            [ "$(jq -r '.id' <<<"$release")" != "$EXPECTED_RELEASE_ID" ]; then
            echo "::error::Prepared release $EXPECTED_RELEASE_ID no longer resolves to $TAG."
            exit 1
          fi
          if [ "$(jq -r '.draft' <<<"$release")" != "true" ]; then
            echo "::error::Release $TAG is no longer the prepared draft; refusing to publish or dispatch."
            exit 1
          fi
          if ! jq -er '[.assets[].name | select(endswith(".dmg"))] | length > 0' <<<"$release" >/dev/null; then
            echo "::error::Release $TAG has no .dmg asset attached; refusing to publish."
            exit 1
          fi
          if [ "$WINDOWS_PUBLISHED" = "true" ] && \
            ! jq -er '[.assets[].name | select(endswith(".exe"))] | length > 0' <<<"$release" >/dev/null; then
            echo "::error::Windows signing succeeded but the release has no signed .exe; refusing to publish."
            exit 1
          fi
          gh api -X PATCH "repos/$REPO/releases/$EXPECTED_RELEASE_ID" -F draft=false >/dev/null
          echo "Published $TAG (release id $EXPECTED_RELEASE_ID)."
      - name: Dispatch post-release publishing and verification
        # GITHUB_TOKEN-created release events do not trigger workflows, but
        # workflow_dispatch does. Pin every dispatch to the already-validated
        # release tag so package, asset, and SBOM jobs read the same tree that
        # produced the attached DMG.
        run: |
          set -euo pipefail
          downstream_run_ids=()
          for workflow in publish.yml release-assets.yml sbom.yml; do
            dispatch="$(gh api -X POST -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$REPO/actions/workflows/$workflow/dispatches" -f ref="$TAG" \
              -F return_run_details=true)"
            if ! run_id="$(jq -er '.workflow_run_id | select(type == "number" and . > 0)' <<<"$dispatch")"; then
              echo "::error::GitHub accepted $workflow but returned no usable run identity."
              exit 1
            fi
            downstream_run_ids+=("$run_id")
            echo "Dispatched $workflow at $TAG as run $run_id."
          done

          downstream_failures=0
          for run_id in "${downstream_run_ids[@]}"; do
            if ! gh run watch "$run_id" --repo "$REPO" --compact --exit-status; then
              downstream_failures=$((downstream_failures + 1))
            fi
          done
          if [ "$downstream_failures" -gt 0 ]; then
            echo "::error::$downstream_failures post-release workflow(s) failed."
            exit 1
          fi
