name: desktop-release

# Fully automated desktop release pipeline. Pushing a tag `vX.Y.Z` builds the
# macOS app, signs and notarizes the DMG, uploads it to that tag's GitHub
# release, flips the release from draft to published, and opens a PR on
# CodesWhat/homebrew-tap bumping the cask. Zero human action once the tag is
# pushed and the one-time signing secrets are configured (docs/RELEASE.md's
# "One-time CI signing setup").
#
# workflow_dispatch backfills an existing tag (e.g. re-running after a
# secrets fix) without requiring a new tag push. The `tag` input is required
# because checkov CKV_GHA_7-style rules aside, a manual run with no target is
# ambiguous here in a way `release-assets.yml`'s dispatch isn't: this
# workflow builds and uploads, it doesn't just check.
#
# Every tag value is resolved once in `resolve-tag` and threaded through the
# other jobs as a job output / env var, never spliced directly into a `run:`
# script body — that's the template-injection pattern zizmor flags.
#
# publish.yml already fires on `release: published`, so flipping the release
# in `publish-release` below also triggers the npm publish. release-assets.yml
# also fires on that event and re-confirms the .dmg is attached; by the time
# it runs here the asset upload already happened, so it's a no-op detector.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.11.0). Used to backfill an existing tag."
        required: true
        type: string

permissions: {}

jobs:
  resolve-tag:
    name: resolve tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - name: Resolve the release tag
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$DISPATCH_TAG"
          if [ -z "$tag" ]; then
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Resolved tag '$tag' does not match vX.Y.Z"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-notarize-upload:
    name: build, notarize, upload dmg
    needs: resolve-tag
    runs-on: macos-14
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # electron-builder normally deletes the temporary keychain it imports
      # CSC_LINK into once the app is signed. release-dmg.mjs codesigns the
      # DMG container separately, after electron-builder's own build step,
      # and needs that identity to still be there when it does.
      CSC_KEEP_CREDENTIALS: "true"
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # This job signs, notarizes, and uploads a release artifact; a
          # poisoned shared dependency cache must never be able to reach it.
          # Same fix as publish.yml's setup-node step.
          package-manager-cache: false
      - name: Verify required signing and notarization secrets are set
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CSC_LINK:-}" ] || missing+=("CSC_LINK")
          [ -n "${CSC_KEY_PASSWORD:-}" ] || missing+=("CSC_KEY_PASSWORD")
          [ -n "${APPLE_API_KEY:-}" ] || missing+=("APPLE_API_KEY")
          [ -n "${APPLE_API_KEY_ID:-}" ] || missing+=("APPLE_API_KEY_ID")
          [ -n "${APPLE_API_ISSUER:-}" ] || missing+=("APPLE_API_ISSUER")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required secrets for the desktop release pipeline: %s\n' "${missing[*]}"
            echo "::error::See docs/RELEASE.md's 'One-time CI signing setup' section to add them."
            exit 1
          fi
          echo "Required signing and notarization secrets are present."
      - name: Ensure a GitHub release exists for the tag
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            echo "No release found for $TAG; creating a draft."
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi
      - name: Write the App Store Connect API key to a runner-temp file
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Build, sign, notarize, staple, verify, and upload the desktop release
        run: npm run desktop:release

  publish-release:
    name: publish release
    needs: [resolve-tag, build-notarize-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - name: Publish the release once the dmg asset is confirmed
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if ! grep -q '\.dmg$' <<<"$assets"; then
              echo "::error::Release $TAG has no .dmg asset attached; refusing to publish."
              exit 1
            fi
            gh release edit "$TAG" --draft=false
            echo "Published $TAG."
          else
            echo "No release found for $TAG; creating one published with generated notes."
            gh release create "$TAG" --generate-notes
          fi

  tap-pr:
    name: open the homebrew tap pr
    needs: [resolve-tag, publish-release]
    # generate-homebrew-cask.sh hashes the DMG with `shasum`, a macOS default.
    runs-on: macos-14
    permissions:
      contents: read
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
      HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - name: Verify the tap PAT secret is set
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_PAT:-}" ]; then
            echo "::error::Missing required secret HOMEBREW_TAP_PAT. See docs/RELEASE.md's 'One-time CI signing setup' section."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          persist-credentials: false
      - name: Resolve the bare version and the tap branch name
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Matches the branch shape CodesWhat/homebrew-tap's other casks
          # already use (see PR #3/#4 on that repo: release/<tool>-v<version>).
          {
            echo "VERSION=$version"
            echo "TAP_BRANCH=release/careerrat-$TAG"
            echo "TAP_DIR=$RUNNER_TEMP/homebrew-tap"
          } >> "$GITHUB_ENV"
      - name: Clone the tap repository
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/CodesWhat/homebrew-tap.git" "$TAP_DIR"
          cd "$TAP_DIR"
          git config user.name "careerrat-release-bot"
          git config user.email "careerrat-release-bot@users.noreply.github.com"
          git checkout -b "$TAP_BRANCH"
      - name: Check for an already-open pr on this branch
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo CodesWhat/homebrew-tap --head "$TAP_BRANCH" --state open --json number --jq '.[0].number // empty')"
          echo "EXISTING_PR=$existing" >> "$GITHUB_ENV"
      - name: Generate the updated cask
        run: |
          set -euo pipefail
          scripts/generate-homebrew-cask.sh --version "$VERSION" --write "$TAP_DIR/Casks/careerrat.rb"
      - name: Commit and push the cask update
        run: |
          set -euo pipefail
          cd "$TAP_DIR"
          if git diff --quiet -- Casks/careerrat.rb; then
            echo "Casks/careerrat.rb is already up to date for $TAG; nothing to commit."
            echo "SKIP_PR=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git add Casks/careerrat.rb
          git commit -m "build(cask): update careerrat to $VERSION"
          git push origin "$TAP_BRANCH"
      - name: Open the tap pr
        run: |
          set -euo pipefail
          if [ "${SKIP_PR:-}" = "true" ]; then
            echo "Nothing to push; skipping pr creation."
            exit 0
          fi
          if [ -n "${EXISTING_PR:-}" ]; then
            echo "A pr for $TAP_BRANCH is already open (#$EXISTING_PR); skipping creation."
            exit 0
          fi
          gh pr create \
            --repo CodesWhat/homebrew-tap \
            --base main \
            --head "$TAP_BRANCH" \
            --title "build(cask): update careerrat to $VERSION" \
            --body "Automated cask update for careerrat $TAG, generated by desktop-release.yml from the published GitHub release DMG."
