name: release-assets

# Detects a GitHub Release that was published without its macOS .dmg attached.
# v0.9.0 shipped with zero assets because the desktop upload step lives in a
# separate manual sequence in docs/RELEASE.md and got skipped. This job does
# not block the release (publish.yml also fires on `release: published`, so
# npm publish runs alongside this check rather than after it); it is a
# detector so a missing asset is loud instead of silent. The actual
# prevention is the draft-first ordering documented in docs/RELEASE.md.

# workflow_dispatch takes no inputs on purpose: checkov CKV_GHA_7 requires
# them to be empty, and the only case worth re-checking by hand is the most
# recent release, which a manual run resolves for itself below.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dmg-asset:
    name: check dmg asset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the release has a matching .dmg asset
        run: |
          set -euo pipefail
          # On `release: published` the tag comes from the event. A manual run
          # has no event payload, so fall back to the latest published release.
          tag="$EVENT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --json tagName --jq '.tagName')"
            echo "No event tag, checking the latest release: $tag"
          fi
          version="${tag#v}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          match="$(grep "\.dmg$" <<<"$assets" | grep -F "$version" || true)"
          if [[ -z "$match" ]]; then
            echo "::error::Release $tag has no .dmg asset matching version $version." \
              "Run \`npm run desktop:release\` to build, notarize, and upload the desktop artifact, then re-run this workflow."
            exit 1
          fi
          echo "Found matching asset: $match"
