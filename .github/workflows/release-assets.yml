name: release-assets

# Detects a GitHub Release published without its complete macOS updater feed.
# v0.9.0 shipped with zero assets because the desktop upload step lives in a
# separate manual sequence in docs/RELEASE.md and got skipped. This job remains
# a detector so a missing asset is loud instead of silent. The actual
# prevention is the draft-first ordering documented in docs/RELEASE.md. The
# desktop pipeline dispatches this check only after its feed gate and release
# publication; a release published with a non-workflow credential can also
# start it through the release event below.

# workflow_dispatch takes no inputs on purpose: checkov CKV_GHA_7 requires
# them to be empty. A tag-pinned dispatch checks that exact release; a manual
# branch dispatch resolves the most recent published release below.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-mac-feed-assets:
    name: check Mac feed assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT_TAG: ${{ github.event.release.tag_name }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout plus `gh release view`. Observed on run 32488752322
          # (baseline still forming — 2 runs since the endpoint set last
          # changed — same api.github.com/github.com pattern as
          # desktop-release.yml's resolve-tag and publish-release jobs).
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the release has the complete Mac update feed
        run: |
          set -euo pipefail
          # On `release: published` the tag comes from the event. A manual run
          # dispatched at a tag uses that exact ref. A manual run from a branch
          # has no exact release identity, so only that path falls back to the
          # latest published release.
          tag="$EVENT_TAG"
          if [ -z "$tag" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          fi
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --json tagName --jq '.tagName')"
            echo "No event tag, checking the latest release: $tag"
          fi
          version="${tag#v}"
          matching_dmgs=()
          matching_zips=()
          manifest_count=0
          while IFS= read -r asset; do
            if [[ "$asset" == CareerRat-"$version"-*.dmg || "$asset" == CareerRat-"$version".dmg ]]; then
              matching_dmgs+=("$asset")
            fi
            if [[ "$asset" == CareerRat-"$version"-*.zip || "$asset" == CareerRat-"$version".zip ]]; then
              matching_zips+=("$asset")
            fi
            if [ "$asset" = "latest-mac.yml" ]; then
              manifest_count=$((manifest_count + 1))
            fi
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          if [ "${#matching_dmgs[@]}" -ne 1 ]; then
            echo "::error::Release $tag must have exactly one .dmg asset matching version $version; found ${#matching_dmgs[@]}."
            exit 1
          fi
          if [ "${#matching_zips[@]}" -ne 1 ]; then
            echo "::error::Release $tag must have exactly one updater .zip asset matching version $version; found ${#matching_zips[@]}."
            exit 1
          fi
          if [ "$manifest_count" -ne 1 ]; then
            echo "::error::Release $tag must have exactly one latest-mac.yml asset; found $manifest_count."
            exit 1
          fi
          echo "Found complete Mac feed: ${matching_dmgs[0]}, ${matching_zips[0]}, and latest-mac.yml"
