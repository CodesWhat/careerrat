name: security-actions

# Lints and scans the GitHub Actions workflows themselves: actionlint catches
# structural/syntax mistakes, zizmor catches Actions-specific security
# anti-patterns (script injection, unpinned actions, overbroad permissions),
# gitleaks catches committed secrets, and dependency-review flags newly
# introduced vulnerable dependencies on incoming PRs. None of these gate
# merges yet — add them to the "Main branch protection" ruleset's
# required_status_checks once each job has run clean for a while.

on:
  pull_request:
    branches: [main, "dev/**"]
  push:
    branches: [main, "dev/**"]
  schedule:
    - cron: "15 3 * * 4" # weekly, Thursday 03:15 UTC (off-peak, distinct from codeql's Monday 04:30 UTC)

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # raven-actions/actionlint installs actionlint via a Python/pip helper
          # (files.pythonhosted.org, pypi.org) and fetches the shellcheck binary
          # from a GitHub release (github.com, release-assets.githubusercontent.com,
          # raw.githubusercontent.com); registry.npmjs.org covers its npm-based
          # setup path. Observed on runs 32512881107 and 32512731942 (Stable
          # baseline, 236 runs since the endpoint set last changed).
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflow files
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # astral-sh/setup-uv fetches uv from its GitHub release
          # (releases.astral.sh) and `uvx zizmor` resolves the package from
          # PyPI (files.pythonhosted.org, pypi.org, raw.githubusercontent.com
          # for uv's own index metadata). Observed on runs 32512881107 and
          # 32512731942 (Stable baseline, 236 runs since the endpoint set last
          # changed).
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Scan workflows for Actions security anti-patterns
        run: uvx zizmor==1.29.0 .github/workflows/ --min-severity medium

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # gitleaks/gitleaks-action requires a paid GITLEAKS_LICENSE for org-owned repos
    # (CodesWhat is an org), so this job runs the free, MIT-licensed gitleaks CLI
    # directly instead. To bump: pick the new release's linux_x64 tarball sha256
    # from https://github.com/gitleaks/gitleaks/releases/download/vX.Y.Z/gitleaks_X.Y.Z_checksums.txt
    # and update both env values together.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout plus the pinned-and-hash-verified gitleaks tarball download
          # from a GitHub release. Observed on runs 32512881107 and 32512731942
          # (Stable baseline, 236 runs since the endpoint set last changed).
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the checked-out ref
          persist-credentials: false
      - name: Download gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
      - name: Scan for committed secrets
        run: ./gitleaks detect --source . --no-banner --redact -v

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # actions/dependency-review-action calls the GitHub dependency-graph
          # diff API (api.github.com) and cross-checks advisories against
          # deps.dev and OpenSSF Scorecard's API. Observed on run 32512731942
          # (Stable baseline, 157 runs since the endpoint set last changed).
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check new dependencies for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
