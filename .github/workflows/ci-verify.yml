name: ci

# Eight jobs. Every job is declared as a required context in
# scripts/protect-main.sh so deterministic product builds and real-browser
# application preparation fail closed with the core test gates.
#
# structure-guards runs a fast fail-early subset: the checks that protect the
# things unit tests can't reach. The retired static dashboard must stay gone,
# the chat-first CSS foundation must retain its structural invariants, every
# shipped YAML config must parse, and release versions stay in sync. Its job name
# ("structure-guards") is one of the status-check contexts listed in the "Main
# branch protection" ruleset's required_status_checks rule.
#
# tests runs the full `npm test` suite and is now in that context list too. It
# was deliberately held back until the flaky SSE watcher test it depends on had
# landed on main and been observed green there, because requiring it earlier
# would have failed every PR in flight on a timing bug rather than on its own
# code. Both halves of that promotion are done: the context is in
# scripts/protect-main.sh's DESIRED block and in the live ruleset, and that
# script's drift guard now holds the two in sync.
#
# qlty and knip remain required as well. The desired list is source-controlled;
# scripts/protect-main.sh's drift check proves whether GitHub's live ruleset has
# caught up without mutating it from CI.

on:
  pull_request:
    branches: [main, "dev/**"]
  push:
    branches: [main, "dev/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure-guards:
    name: structure-guards
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # This job only checks out the repo and runs local node --test files;
          # observed on run 32512881196 (checkout's git-remote-http call, no
          # other egress).
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Structure guards (chat-first shell, CSS foundation, YAML, and release versions)
        run: node --test tests/static-dashboard-retirement.test.mjs tests/chat-first-foundation-style.test.mjs tests/yaml.test.mjs tests/release-consistency.test.mjs

  # Full suite (`npm test`, i.e. `node --test 'tests/**/*.test.mjs'`) — the real gate,
  # not just the structure-guards subset. A handful of integration tests self-skip
  # via node's test-runner `skip:` option when ANTHROPIC_API_KEY isn't set (chat-runtime,
  # intake-classify, intake-extract, resume-extract, skill-runtime); every other test
  # is deterministic and runs the same on ubuntu-latest as it does locally. This job's
  # name ("tests") is in the "Main branch protection" ruleset's required_status_checks,
  # so unlike web-build below, a red run here blocks the merge.
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout + npm ci, plus the full suite's own live calls: job-link-checker's
          # DNS/liveness probes against jobs.lever.co and wellfound.com
          # (job-link-checker.test.mjs, portal-coverage.test.mjs — checkUrlLiveness
          # resolves the host before the mocked fetch runs), and call-ai's
          # provider-validation probe against api.anthropic.com. Observed on run
          # 32512881196 across 83 runs since the endpoint set last changed.
          allowed-endpoints: >
            api.anthropic.com:443
            github.com:443
            jobs.lever.co:443
            registry.npmjs.org:443
            wellfound.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Core test suite
        run: npm test
      - name: Web UI test suite
        run: npm --workspace apps/web test

  # M7 — builds the apps/web SPA shell as its own required product gate.
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout + npm ci + npm run build; observed on run 32512881196
          # (Stable baseline, 152 runs since the endpoint set last changed).
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build the web app shell (apps/web)
        run: npm run build --workspace apps/web

  # The marketing site plus the Fumadocs docs it embeds. `npm run build
  # --workspace apps/website` chains build-docs-content.mjs, the apps/docs
  # Next build, and then the website build, so this one job covers all three.
  #
  # It exists because nothing else did. web-build above builds apps/web only,
  # so on 2026-08-20 a TypeScript 6 bump made `baseUrl` a hard error and broke
  # the docs build on main with every in-repo check still green. The only
  # signal was the Vercel context, which fails on deploy quota so routinely
  # that a real failure there reads as noise. This deterministic build is the
  # required product gate instead.
  website-build:
    name: website-build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout + npm ci + npm run build (apps/website, apps/docs); observed
          # on run 32512881196 (baseline still forming — 47 runs since the
          # endpoint set last changed — but the same two hosts as web-build's
          # stable baseline).
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build the marketing site and docs (apps/website, apps/docs)
        run: npm run build --workspace apps/website

  # Builds the real Windows installer on every PR/push and drives it through
  # silent install, packaged Electron mount, PDF export, bundled Playwright
  # Chromium launch, and uninstall. It is intentionally unsigned here and
  # retained only as a short-lived Actions QA artifact.
  windows-package-smoke:
    name: windows-package-smoke
    runs-on: windows-latest
    steps:
      - name: Harden the runner (audit Electron and Chromium downloads)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build the Windows x64 NSIS installer
        run: npm run dist:windows --workspace apps/desktop
      - name: Verify install, packaged smoke, and uninstall
        run: npm run verify:windows --workspace apps/desktop
      - name: Retain the unsigned installer for QA only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: careerrat-windows-x64-unsigned-qa
          path: apps/desktop/dist/CareerRat-*-win-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7

  # Exercises the real Chromium application-preparation boundary without any
  # provider call, login, final Submit click, or Applied write. The fixtures
  # cover the multi-step application and native dropdown/radio controls.
  browser-application-prep:
    name: browser-application-prep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAREERRAT_LIVE_BROWSER: "1"
    steps:
      - name: Harden the runner (audit Chromium and system dependency downloads)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install the real Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Build the app used by the visual contract
        run: npm run build --workspace apps/web
      - name: Verify application preparation and rendered workspace geometry
        run: node --test tests/playwright-live.test.mjs tests/playwright-live-dropdowns.test.mjs tests/playwright-app-visual.test.mjs
      - name: Retain the rendered workspace screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: careerrat-browser-visual
          path: output/playwright
          if-no-files-found: error
          retention-days: 7

  # Qlty (shell/Docker/Actions/YAML lint, secret + dependency scanning — see
  # .qlty/qlty.toml; Biome stays out of qlty and lints JS/JSON separately).
  # "changed" mode diffs against origin/main, same as the local pre-push gate
  # (scripts/qlty-check-gate.sh) — CareerRat is pre-launch and carries a real
  # doc/YAML backlog a repo-wide run would fail on immediately. This job IS in
  # the "Main branch protection" ruleset's required_status_checks, so a red run
  # blocks the merge. Not to be confused with the separate "qlty check" context
  # from Qlty Cloud, which is not required and currently fails on every PR
  # because the account is out of minutes.
  qlty:
    name: qlty
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # Qlty pulls its own binary plus the Python/Go/Node toolchains its
          # bundled linters need. Observed on run 32512881196 (Stable baseline,
          # 127 runs since the endpoint set last changed): api.github.com/
          # cafe.github.com/github.com/tuf-repo.github.com (GitHub + gh CLI),
          # api.segment.io (qlty telemetry), api0.prismacloud.io (qlty's own
          # scan callback), dl.google.com/go.dev/proxy.golang.org/sum.golang.org
          # (Go toolchain), files.pythonhosted.org/pypi.org (Python linters),
          # github-proxy.qlty.sh/qlty-releases.s3.amazonaws.com/
          # tmaproduction.blob.core.windows.net (qlty's own release + config
          # delivery), nodejs.org (Node toolchain), registry.npmjs.org (npm
          # ci), release-assets.githubusercontent.com (GitHub release asset
          # downloads), radarlint-releases.s3.amazonaws.com (Radarlint),
          # tuf-repo-cdn.sigstore.dev (sigstore verification).
          allowed-endpoints: >
            api.github.com:443
            api.segment.io:443
            api0.prismacloud.io:443
            cafe.github.com:443
            dl.google.com:443
            files.pythonhosted.org:443
            github-proxy.qlty.sh:443
            github.com:443
            go.dev:443
            nodejs.org:443
            proxy.golang.org:443
            pypi.org:443
            qlty-releases.s3.amazonaws.com:443
            radarlint-releases.s3.amazonaws.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed so `--upstream origin/main` resolves
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup Qlty
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
      - name: Qlty check (changed files vs origin/main)
        run: ./scripts/qlty-check-gate.sh changed

  # Knip (unused files/exports/dependencies, see knip.json). This job IS in the
  # required_status_checks ruleset, so a red run blocks the merge.
  #
  # --max-issues ratchets against the current genuine backlog so the gate
  # catches NEW dead code without blocking on existing debt. Lower it as debt
  # is cleaned. Never raise it: raising it is how a ratchet stops being one.
  #
  # 12 as of 2026-08-21, down from 170 (44 after #135, 32 after #142 deleted 12
  # stale api.js wrappers, 30 once #141 wired the two that were kept, 12 once
  # refactor/knip-long-tail de-exported/removed 18 src/-only findings). The
  # remainder is not a to-do list: it is 4 fontsource packages loaded by raw
  # file path through next/font/local (invisible to knip, and removing them
  # silently breaks the typeface); SAFE_EXTERNAL_PROTOCOLS (apps/desktop) and
  # postSSE (apps/web), both outside this pass's src/-only scope; portalQuirks
  # (src/core/apply/form-fill.mjs), called directly by the apply-job skill
  # (.agents/skills/apply-job/SKILL.md) with no JS importer for knip to find;
  # resolveCompFloor/scoreFit (src/core/evaluate/gate.mjs) and CLAIM_FIELDS
  # (src/core/profile/evidence-writer.mjs), held for the coaching-loop
  # feature whose evidence path runs through that module. (The interview
  # packet helpers once held here turned out to be same-file-called shipped
  # code with a stray export keyword; de-exported like their fifteen
  # siblings.)
  #
  # Getting to 0 therefore means teaching knip about those references, not
  # deleting them: tag the intentional ones and configure knip to exclude the
  # tag. Anyone who closes the gap by deleting instead has made the number
  # prettier and the product worse.
  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout + npm ci + npx knip; observed on run 32512881196 (Stable
          # baseline, 152 runs since the endpoint set last changed).
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Knip check
        run: npx knip --no-progress --max-issues=10
