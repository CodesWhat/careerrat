name: ci

# Eight jobs. Every job is declared as a required context in
# scripts/protect-main.sh so deterministic product builds and real-browser
# application preparation fail closed with the core test gates.
#
# structure-guards runs a fast fail-early subset: the checks that protect the
# things unit tests can't reach. The retired static dashboard must stay gone,
# the chat-first CSS foundation must retain its structural invariants, every
# shipped YAML config must parse, and release versions stay in sync. Its job name
# ("structure-guards") is one of the status-check contexts listed in the "Main
# branch protection" ruleset's required_status_checks rule.
#
# tests runs the full `npm test` suite and is now in that context list too. It
# was deliberately held back until the flaky SSE watcher test it depends on had
# landed on main and been observed green there, because requiring it earlier
# would have failed every PR in flight on a timing bug rather than on its own
# code. Both halves of that promotion are done: the context is in
# scripts/protect-main.sh's DESIRED block and in the live ruleset, and that
# script's drift guard now holds the two in sync.
#
# qlty and knip remain required as well. The desired list is source-controlled;
# scripts/protect-main.sh's drift check proves whether GitHub's live ruleset has
# caught up without mutating it from CI.

on:
  pull_request:
    branches: [main, "dev/**"]
  push:
    branches: [main, "dev/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure-guards:
    name: structure-guards
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # This job only checks out the repo and runs local node --test files;
          # observed on run 32512881196 (checkout's git-remote-http call, no
          # other egress).
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Structure guards (chat-first shell, CSS foundation, YAML, and release versions)
        run: node --test tests/static-dashboard-retirement.test.mjs tests/chat-first-foundation-style.test.mjs tests/yaml.test.mjs tests/release-consistency.test.mjs

  # Full suite (`npm test`, i.e. `node --test 'tests/**/*.test.mjs'`) — the real gate,
  # not just the structure-guards subset. A handful of integration tests self-skip
  # via node's test-runner `skip:` option when ANTHROPIC_API_KEY isn't set (chat-runtime,
  # intake-classify, intake-extract, resume-extract, skill-runtime); every other test
  # is deterministic and runs the same on ubuntu-latest as it does locally. This job's
  # name ("tests") is in the "Main branch protection" ruleset's required_status_checks,
  # so unlike web-build below, a red run here blocks the merge.
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout + npm ci, plus the full suite's own live calls: job-link-checker's
          # DNS/liveness probes against jobs.lever.co and wellfound.com
          # (job-link-checker.test.mjs, portal-coverage.test.mjs — checkUrlLiveness
          # resolves the host before the mocked fetch runs), and call-ai's
          # provider-validation probe against api.anthropic.com. Observed on run
          # 32512881196 across 83 runs since the endpoint set last changed.
          allowed-endpoints: >
            api.anthropic.com:443
            github.com:443
            jobs.lever.co:443
            registry.npmjs.org:443
            wellfound.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Activate the repository-pinned npm release
        run: |
          set -euo pipefail
          corepack enable npm
          EXPECTED_NPM="$(node -p "require('./package.json').packageManager")"
          if ! printf '%s' "$EXPECTED_NPM" | grep -Eq '^npm@[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::packageManager must pin an exact npm version, found '$EXPECTED_NPM'."
            exit 1
          fi
          actual_npm="npm@$(npm --version)"
          if [ "$actual_npm" != "$EXPECTED_NPM" ]; then
            echo "::error::Corepack activated $actual_npm instead of $EXPECTED_NPM."
            exit 1
          fi
          echo "TRUSTED_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Install dependencies (scripts held back until allowScripts is checked)
        run: npm ci --ignore-scripts --no-bin-links
      - name: Check allowScripts coverage (root package.json vs package-lock.json)
        run: '"$TRUSTED_NODE" scripts/check-install-scripts.mjs'
      # npm rebuild has no root lifecycle phase (it skips prepublish,
      # preprepare, prepare, and postprepare) and only runs `prepare` for
      # Link nodes, so it never replays a regular Git dependency's approved
      # prepare hook either. `npm ci --strict-allow-scripts` is the pinned
      # npm's real strict install path instead: a second full `npm ci` that
      # replays every lifecycle phase a normal `npm ci` runs, and turns any
      # unreviewed install script into a hard failure rather than a warning
      # (npm 12.0.2 docs/content/commands/npm-ci.md, `strict-allow-scripts`:
      # "If true, turn the install-script policy from a warning into a hard
      # error: any dependency with install scripts that is not covered by
      # allowScripts will fail the install instead of being blocked with a
      # warning"). `--no-bin-links` stays on through this step too (Codex
      # review /tmp/codex-305-r7.md, finding 1): without it, this reinstall
      # would recreate every dependency's bin symlinks before its own
      # approved script runs, so a scriptless, unreviewed package that ships
      # a `bin.node` entry could sit ahead of the real interpreter on PATH
      # for an approved postinstall that invokes bare `node`.
      - name: Run approved install scripts (fails closed on anything unreviewed)
        run: npm ci --strict-allow-scripts --no-dangerously-allow-all-scripts --no-ignore-scripts --no-bin-links
      # Bin links only, no scripts: with the strict install above still
      # `--no-bin-links`, nothing on PATH points at a dependency's own bin
      # until this step runs. `npm rebuild` is npm's own documented tool for
      # exactly this split (npm 12.0.2 docs/content/commands/npm-rebuild.md,
      # Description: "Installing with --ignore-scripts and --no-bin-links,
      # to explicitly choose which packages to build and/or link bins.").
      # It operates on the tree already on disk rather than reinstalling, so
      # it can't discard anything the approved postinstall above just
      # wrote, and passing --ignore-scripts here is verified against
      # @npmcli/arborist's rebuild builder (lib/arborist/rebuild.js#build):
      # every lifecycle queue (preinstall/install/postinstall/prepare) is
      # gated behind `if (!this.options.ignoreScripts)`, while bin linking
      # runs unconditionally when bin-links is enabled, so this step cannot
      # re-run a script, reviewed or not.
      - name: Materialize dependency bin links (scripts already ran; this only links)
        run: npm rebuild --ignore-scripts
      - name: Core test suite
        run: npm test
      - name: Web UI test suite
        run: npm --workspace apps/web test

