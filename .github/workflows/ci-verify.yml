      # re-run a script, reviewed or not.
      - name: Materialize dependency bin links (scripts already ran; this only links)
        shell: bash
        run: npm rebuild --ignore-scripts
      - name: Build the Windows x64 NSIS installer
        run: npm run dist:windows --workspace apps/desktop
      - name: Verify install, packaged smoke, and uninstall
        run: npm run verify:windows --workspace apps/desktop
      - name: Retain the unsigned installer for QA only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: careerrat-windows-x64-unsigned-qa
          path: apps/desktop/dist/CareerRat-*-win-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7

  # Exercises the real Chromium application-preparation boundary without any
  # provider call, login, final Submit click, or Applied write. The fixtures
  # cover the multi-step application and native dropdown/radio controls.
  browser-application-prep:
    name: browser-application-prep
