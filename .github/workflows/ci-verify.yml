      # @npmcli/arborist's rebuild builder (lib/arborist/rebuild.js#build):
      # every lifecycle queue (preinstall/install/postinstall/prepare) is
      # gated behind `if (!this.options.ignoreScripts)`, while bin linking
      # runs unconditionally when bin-links is enabled, so this step cannot
      # re-run a script, reviewed or not.
      - name: Materialize dependency bin links (scripts already ran; this only links)
        run: npm rebuild --ignore-scripts
      - name: Install the real Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Build the app used by the visual contract
        run: npm run build --workspace apps/web
      - name: Verify application preparation and rendered workspace geometry
        # Serialized on purpose. Each of these files drives its own real
        # Chromium, and node --test runs files in parallel by default, so on a
        # hosted runner all three launch browsers at once and starve each other.
        # The render-bound visual contract is the one that loses: it takes ~2s
        # alone, ~4s alongside the other two on a 14-core box, and blew past its
        # 30s budget twice on a 4-vCPU runner while the fixed-wait dropdown tests
        # next to it barely moved.
        run: node --test --test-concurrency=1 tests/playwright-live.test.mjs tests/playwright-live-dropdowns.test.mjs tests/playwright-app-visual.test.mjs
      - name: Retain the rendered workspace screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: careerrat-browser-visual
          path: output/playwright
          # warn, not error: this step runs on failure too, and a test that
          # times out before it screenshots leaves the path empty. Erroring
          # there replaces the real failure with "No files were found" and
          # uploads nothing, which is exactly when the trace is needed. The
          # test step already failed the job, so the signal is not lost.
          if-no-files-found: warn
          retention-days: 7

  # Qlty (shell/Docker/Actions/YAML lint, secret + dependency scanning — see
  # .qlty/qlty.toml; Biome stays out of qlty and lints JS/JSON separately).
  # "changed" mode diffs against origin/main, same as the local pre-push gate
  # (scripts/qlty-check-gate.sh) — CareerRat is pre-launch and carries a real
  # doc/YAML backlog a repo-wide run would fail on immediately. This job IS in
  # the "Main branch protection" ruleset's required_status_checks, so a red run
  # blocks the merge. Not to be confused with the separate "qlty check" context
  # from Qlty Cloud, which is not required and currently fails on every PR
  # because the account is out of minutes.
  qlty:
    name: qlty
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # Qlty pulls its own binary plus the Python/Go/Node toolchains its
          # bundled linters need. Observed on run 32512881196 (Stable baseline,
          # 127 runs since the endpoint set last changed): api.github.com/
          # cafe.github.com/github.com/tuf-repo.github.com (GitHub + gh CLI),
          # api.segment.io (qlty telemetry), api0.prismacloud.io (qlty's own
          # scan callback), dl.google.com/go.dev/proxy.golang.org/sum.golang.org
          # (Go toolchain), files.pythonhosted.org/pypi.org (Python linters),
          # github-proxy.qlty.sh/qlty-releases.s3.amazonaws.com/
          # tmaproduction.blob.core.windows.net (qlty's own release + config
          # delivery), nodejs.org (Node toolchain), registry.npmjs.org (npm
          # ci), release-assets.githubusercontent.com (GitHub release asset
          # downloads), radarlint-releases.s3.amazonaws.com (Radarlint),
          # tuf-repo-cdn.sigstore.dev (sigstore verification).
          allowed-endpoints: >
            api.github.com:443
            api.segment.io:443
            api0.prismacloud.io:443
            cafe.github.com:443
            dl.google.com:443
            files.pythonhosted.org:443
            github-proxy.qlty.sh:443
            github.com:443
            go.dev:443
            nodejs.org:443
            proxy.golang.org:443
            pypi.org:443
            qlty-releases.s3.amazonaws.com:443
            radarlint-releases.s3.amazonaws.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed so `--upstream origin/main` resolves
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup Qlty
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
      - name: Qlty check (changed files vs origin/main)
        run: ./scripts/qlty-check-gate.sh changed

  # Knip (unused files/exports/dependencies, see knip.json). This job IS in the
  # required_status_checks ruleset, so a red run blocks the merge.
  #
  # The dead-code ratchet is zero. Intentional non-import references are modeled
  # in knip.json, so any new unused file, export, or dependency blocks the merge.
  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (block all outbound calls except the allowlist)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout + npm ci + npx knip; observed on run 32512881196 (Stable
          # baseline, 152 runs since the endpoint set last changed).
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Activate the repository-pinned npm release
        run: |
          set -euo pipefail
          corepack enable npm
          EXPECTED_NPM="$(node -p "require('./package.json').packageManager")"
          if ! printf '%s' "$EXPECTED_NPM" | grep -Eq '^npm@[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::packageManager must pin an exact npm version, found '$EXPECTED_NPM'."
            exit 1
          fi
          actual_npm="npm@$(npm --version)"
          if [ "$actual_npm" != "$EXPECTED_NPM" ]; then
            echo "::error::Corepack activated $actual_npm instead of $EXPECTED_NPM."
            exit 1
          fi
          echo "TRUSTED_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Install dependencies (scripts held back until allowScripts is checked)
        run: npm ci --ignore-scripts --no-bin-links
      - name: Check allowScripts coverage (root package.json vs package-lock.json)
        run: '"$TRUSTED_NODE" scripts/check-install-scripts.mjs'
      # npm rebuild has no root lifecycle phase (it skips prepublish,
      # preprepare, prepare, and postprepare) and only runs `prepare` for
      # Link nodes, so it never replays a regular Git dependency's approved
      # prepare hook either. `npm ci --strict-allow-scripts` is the pinned
      # npm's real strict install path instead: a second full `npm ci` that
      # replays every lifecycle phase a normal `npm ci` runs, and turns any
      # unreviewed install script into a hard failure rather than a warning
      # (npm 12.0.2 docs/content/commands/npm-ci.md, `strict-allow-scripts`:
      # "If true, turn the install-script policy from a warning into a hard
      # error: any dependency with install scripts that is not covered by
      # allowScripts will fail the install instead of being blocked with a
      # warning"). `--no-bin-links` stays on through this step too (Codex
      # review /tmp/codex-305-r7.md, finding 1): without it, this reinstall
      # would recreate every dependency's bin symlinks before its own
      # approved script runs, so a scriptless, unreviewed package that ships
      # a `bin.node` entry could sit ahead of the real interpreter on PATH
      # for an approved postinstall that invokes bare `node`.
      - name: Run approved install scripts (fails closed on anything unreviewed)
        run: npm ci --strict-allow-scripts --no-dangerously-allow-all-scripts --no-ignore-scripts --no-bin-links
      # Bin links only, no scripts: with the strict install above still
      # `--no-bin-links`, nothing on PATH points at a dependency's own bin
      # until this step runs. `npm rebuild` is npm's own documented tool for
      # exactly this split (npm 12.0.2 docs/content/commands/npm-rebuild.md,
      # Description: "Installing with --ignore-scripts and --no-bin-links,
      # to explicitly choose which packages to build and/or link bins.").
      # It operates on the tree already on disk rather than reinstalling, so
      # it can't discard anything the approved postinstall above just
      # wrote, and passing --ignore-scripts here is verified against
      # @npmcli/arborist's rebuild builder (lib/arborist/rebuild.js#build):
      # every lifecycle queue (preinstall/install/postinstall/prepare) is
      # gated behind `if (!this.options.ignoreScripts)`, while bin linking
      # runs unconditionally when bin-links is enabled, so this step cannot
      # re-run a script, reviewed or not.
      - name: Materialize dependency bin links (scripts already ran; this only links)
        run: npm rebuild --ignore-scripts
      - name: Knip check
        run: npx knip --no-progress --max-issues=0
