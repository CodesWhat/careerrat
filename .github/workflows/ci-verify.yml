name: ci

# Six jobs. Four of them gate a merge. web-build and website-build don't.
#
# structure-guards runs a fast fail-early subset: the checks that protect the
# things unit tests can't reach. The dashboard client <script> must parse as
# valid JS, the dashboard CSS must be well-formed, every shipped YAML config
# must parse, and release versions stay in sync. Its job name
# ("structure-guards") is one of the status-check contexts listed in the "Main
# branch protection" ruleset's required_status_checks rule.
#
# tests runs the full `npm test` suite and is now in that context list too. It
# was deliberately held back until the flaky SSE watcher test it depends on had
# landed on main and been observed green there, because requiring it earlier
# would have failed every PR in flight on a timing bug rather than on its own
# code. Both halves of that promotion are done: the context is in
# scripts/protect-main.sh's DESIRED block and in the live ruleset, and that
# script's drift guard now holds the two in sync.
#
# web-build and website-build are the jobs below that run without gating. qlty
# and knip are both in the required-context list, checked against the live
# ruleset on 2026-08-20. This header used to name all three as non-gating, which was the
# exact failure it warns about one line down: a comment describing a gate
# wrongly is the same problem protect-main.sh exists to catch, written in prose
# instead of JSON, and prose has no drift guard. Re-read the live ruleset
# (`gh api repos/CodesWhat/careerrat/rulesets/18182960`) before editing this
# paragraph rather than trusting what it currently says.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure-guards:
    name: structure-guards
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Structure guards (client JS parses, CSS valid, YAML valid, release versions in sync)
        run: node --test tests/client-script.test.mjs tests/styles.test.mjs tests/yaml.test.mjs tests/release-consistency.test.mjs

  # Full suite (`npm test`, i.e. `node --test 'tests/**/*.test.mjs'`) — the real gate,
  # not just the structure-guards subset. A handful of integration tests self-skip
  # via node's test-runner `skip:` option when ANTHROPIC_API_KEY isn't set (chat-runtime,
  # intake-classify, intake-extract, resume-extract, skill-runtime); every other test
  # is deterministic and runs the same on ubuntu-latest as it does locally. This job's
  # name ("tests") is in the "Main branch protection" ruleset's required_status_checks,
  # so unlike web-build below, a red run here blocks the merge.
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm test

  # M7 — builds the apps/web SPA shell. Non-gating (not in the "Main branch
  # protection" ruleset's required_status_checks) until the workspace is
  # stable, the same "real, running, but not yet required" pattern
  # codeql.yml's own header comment documents for code-scanning results.
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build the web app shell (apps/web)
        run: npm run build --workspace apps/web

  # The marketing site plus the Fumadocs docs it embeds. `npm run build
  # --workspace apps/website` chains build-docs-content.mjs, the apps/docs
  # Next build, and then the website build, so this one job covers all three.
  #
  # It exists because nothing else did. web-build above builds apps/web only,
  # so on 2026-08-20 a TypeScript 6 bump made `baseUrl` a hard error and broke
  # the docs build on main with every in-repo check still green. The only
  # signal was the Vercel context, which fails on deploy quota so routinely
  # that a real failure there reads as noise. Non-gating for now, same
  # "running but not required" posture as web-build.
  website-build:
    name: website-build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build the marketing site and docs (apps/website, apps/docs)
        run: npm run build --workspace apps/website

  # Qlty (shell/Docker/Actions/YAML lint, secret + dependency scanning — see
  # .qlty/qlty.toml; Biome stays out of qlty and lints JS/JSON separately).
  # "changed" mode diffs against origin/main, same as the local pre-push gate
  # (scripts/qlty-check-gate.sh) — CareerRat is pre-launch and carries a real
  # doc/YAML backlog a repo-wide run would fail on immediately. This job IS in
  # the "Main branch protection" ruleset's required_status_checks, so a red run
  # blocks the merge. Not to be confused with the separate "qlty check" context
  # from Qlty Cloud, which is not required and currently fails on every PR
  # because the account is out of minutes.
  qlty:
    name: qlty
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed so `--upstream origin/main` resolves
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup Qlty
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
      - name: Qlty check (changed files vs origin/main)
        run: ./scripts/qlty-check-gate.sh changed

  # Knip (unused files/exports/dependencies, see knip.json). This job IS in the
  # required_status_checks ruleset, so a red run blocks the merge.
  #
  # --max-issues ratchets against the current genuine backlog so the gate
  # catches NEW dead code without blocking on existing debt. Lower it as debt
  # is cleaned. Never raise it: raising it is how a ratchet stops being one.
  #
  # 32 as of 2026-08-20, down from 170 (44 after #135, then 12 stale api.js
  # wrappers deleted). The remainder is not a to-do list: it is 4 fontsource
  # packages loaded by raw file path through next/font/local (invisible to
  # knip, and removing them silently breaks the typeface) plus 28 exports
  # deliberately kept. Most are named by a skill, doc, comment, or dynamic
  # import with no JS importer for knip to find, and each is justified in the
  # commit that spared it (#130 through #133). Two of them, checkAiKey and
  # getDiscoveryState, are the opposite case: exported ahead of UI that does
  # not exist yet, tracked in issue #141.
  #
  # Getting to 0 therefore means teaching knip about those references, not
  # deleting them: tag the intentional ones and configure knip to exclude the
  # tag. Anyone who closes the gap by deleting instead has made the number
  # prettier and the product worse.
  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Knip check
        run: npx knip --no-progress --max-issues=32
