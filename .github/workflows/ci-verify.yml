name: ci

# Two jobs, and only one of them currently gates a merge.
#
# structure-guards runs a fast fail-early subset: the checks that protect the
# things unit tests can't reach. The dashboard client <script> must parse as
# valid JS, the dashboard CSS must be well-formed, every shipped YAML config
# must parse, and release versions stay in sync. Its job name
# ("structure-guards") is one of the status-check contexts listed in the "Main
# branch protection" ruleset's required_status_checks rule.
#
# tests runs the full `npm test` suite. It is NOT in that rule's context list,
# so a red `tests` run does not block a merge today: it is a visible signal,
# not a gate. Making it required is the intended end state, but it should not
# happen from a branch whose own fix for the flaky SSE watcher test has not
# landed on main yet, or every PR in flight starts failing on a timing bug
# rather than on its own code. Sequence is: land this, then add `tests` to
# BOTH scripts/protect-main.sh's DESIRED block and the live ruleset, which
# that script's drift guard will then hold in sync.
#
# Do not describe this job as gating merges until that has actually been done.
# A comment claiming a gate that isn't there is the same class of problem
# protect-main.sh exists to catch, just written in prose instead of JSON.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure-guards:
    name: structure-guards
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Structure guards (client JS parses, CSS valid, YAML valid, release versions in sync)
        run: node --test tests/client-script.test.mjs tests/styles.test.mjs tests/yaml.test.mjs tests/release-consistency.test.mjs

  # Full suite (`npm test`, i.e. `node --test 'tests/**/*.test.mjs'`) — the real gate,
  # not just the structure-guards subset. A handful of integration tests self-skip
  # via node's test-runner `skip:` option when ANTHROPIC_API_KEY isn't set (chat-runtime,
  # intake-classify, intake-extract, resume-extract, skill-runtime); every other test
  # is deterministic and runs the same on ubuntu-latest as it does locally. Not yet
  # added to the "Main branch protection" ruleset's required_status_checks — same
  # "real, running, but not yet required" posture as web-build/qlty/knip below, until
  # it's been observed green on GitHub.
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm test

  # M7 — builds the apps/web SPA shell. Non-gating (not in the "Main branch
  # protection" ruleset's required_status_checks) until the workspace is
  # stable, the same "real, running, but not yet required" pattern
  # codeql.yml's own header comment documents for code-scanning results.
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build the web app shell (apps/web)
        run: npm run build --workspace apps/web

  # Qlty (shell/Docker/Actions/YAML lint, secret + dependency scanning — see
  # .qlty/qlty.toml; Biome stays out of qlty and lints JS/JSON separately).
  # "changed" mode diffs against origin/main, same as the local pre-push gate
  # (scripts/qlty-check-gate.sh) — CareerRat is pre-launch and carries a real
  # doc/YAML backlog a repo-wide run would fail on immediately. Not yet added
  # to the "Main branch protection" ruleset's required_status_checks, the
  # same "real, running, but not yet required" posture as web-build above.
  qlty:
    name: qlty
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed so `--upstream origin/main` resolves
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup Qlty
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
      - name: Qlty check (changed files vs origin/main)
        run: ./scripts/qlty-check-gate.sh changed

  # Knip (unused files/exports/dependencies — see knip.json). --max-issues
  # ratchets against the CURRENT genuine backlog documented in the
  # gates-tranche report (real entries first, targeted ignores only for
  # verified dynamic-loading false positives) so this catches new dead code
  # without blocking on existing debt. Not yet in the required_status_checks
  # ruleset — same posture as qlty/web-build above.
  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # house target is `block` once observed endpoints are allowlisted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Knip check
        run: npx knip --no-progress --max-issues=170
