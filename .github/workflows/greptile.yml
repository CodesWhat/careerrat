name: Greptile second opinion

# Opt-in second-opinion review. Greptile never reviews unbidden (greptile.json
# pins skipReview: AUTOMATIC), so the "second-opinion" label is its only
# automatic trigger in this workflow, applied by CodeRabbit's
# labeling_instructions (.coderabbit.yaml) when the diff is security-sensitive,
# a large refactor, or review findings conflict with the PR description. Manual
# "@greptileai" comment reviews remain available. See CodesWhat/.github
# REPOSITORY_ONBOARDING.md.
#
# pull_request_target (not pull_request) so labeled fork PRs get a
# write-scoped token for the summon comment; the job is label-gated (a
# maintainer applying "second-opinion" is the consent step), and the frozen
# reusable workflow only validates the head SHA and posts a comment - it
# never checks out or executes PR code.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] label-gated, no PR code checkout
    types: [labeled]

permissions: {}

jobs:
  summon:
    # `state == 'open'` because a label can land on an already-closed PR,
    # and the frozen reusable workflow fails loudly rather than no-opping
    # (`Pull request #234 is closed`, 2026-08-27). Refusing to summon is
    # the caller's job; the shared workflow is right to stay strict.
    if: >-
      github.event.label.name == 'second-opinion'
      && github.event.pull_request.state == 'open'
    permissions:
      pull-requests: write
    uses: CodesWhat/.github/.github/workflows/greptile-summon.yml@01bf40b06b110946f12a49b82e407d77c6480df7 # frozen 2026-08-17
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
