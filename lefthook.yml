# Git hooks for CareerRat. Install them in a source checkout with
# `npm run hooks:install`.
#
# Adoption is incremental: Biome enforces only on the files a commit actually
# touches (so the pre-existing lint backlog doesn't block work), while the fast
# structural guards run every commit to protect the current app foundation,
# retired dashboard boundary, and shipped YAML configuration. The full gate suite runs on push,
# mirroring CI (see .github/workflows/ci-verify.yml's `qlty` and `knip` jobs).

commit-msg:
  jobs:
    - name: conventional-commit
      run: node scripts/validate-commit-msg.mjs {1}

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,jsx,ts,tsx,json}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: structure-guards
      # Fast source checks for the React app foundation, static dashboard
      # retirement, and every shipped YAML config. No build or browser required.
      run: node --test tests/chat-first-foundation-style.test.mjs tests/static-dashboard-retirement.test.mjs tests/config-yaml-parses.test.mjs

# Piped (not parallel): fail fast in the order listed, cheapest checks first,
# same order as CI's gate jobs.
pre-push:
  piped: true
  jobs:
    - name: biome
      # Read-only (no --write) — full repo, not just the push's changed files.
      run: npx biome check .
    - name: qlty
      # "changed" mode (diff vs origin/main) — CareerRat is pre-launch and
      # carries a real doc/YAML backlog (examples/, templates/) that a
      # repo-wide run would fail on immediately. See
      # scripts/qlty-check-gate.sh and .qlty/qlty.toml.
      run: ./scripts/qlty-check-gate.sh changed
    - name: knip
      # Ratchet baseline: --max-issues pins the CURRENT genuine unused
      # files/exports/deps count (see knip.json) so the gate catches new dead
      # code without blocking on the existing backlog. Lower this number as
      # debt is cleaned up; never raise it. Keep it identical to the number in
      # .github/workflows/ci-verify.yml, since a pre-push hook looser than CI
      # just moves the failure to a slower place.
      run: npx knip --no-progress --max-issues=10
    - name: tests
      run: npm test
