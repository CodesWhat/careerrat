<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unwrapped native radio application fixture</title>
  </head>
  <body>
    <form id="sponsorship-form">
      <p id="sponsorship-question">Will you now or in the future require sponsorship?</p>
      <div>
        <label><input type="radio" name="eligibility" value="Yes" required /> Yes</label>
        <label><input type="radio" name="eligibility" value="No" required /> No</label>
      </div>
      <button type="submit">Submit sponsorship form</button>
    </form>

    <form id="authorization-form">
      <p id="authorization-question">Are you authorized to work?</p>
      <div>
        <label><input type="radio" name="eligibility" value="Yes" required /> Yes</label>
        <label><input type="radio" name="eligibility" value="No" required /> No</label>
      </div>
      <button type="submit">Submit authorization form</button>
    </form>
  </body>
</html>
