# electron-builder config for the Rolester desktop shell (M5, macOS-first).
#
# `npm run dist` runs `stage.mjs` first (builds staging/rolester, the
# extraResources tree below) then electron-builder itself.
#
# Signing: a Developer ID Application certificate (team ID 3524374A2S) is
# already in the keychain — electron-builder auto-discovers it, so
# `mac.identity` is deliberately left unset (setting it explicitly would
# override auto-discovery for no benefit here).
#
# Notarization: DEFERRED. No `notarytool` keychain profile exists yet, so
# notarization is explicitly disabled below rather than left to fail at
# build time. See README.md for the one-time `xcrun notarytool
# store-credentials` setup step that turns this back on.
appId: com.codeswhat.rolester
productName: Rolester
directories:
  output: dist
files:
  - main.mjs
  - package.json
extraResources:
  - from: staging/rolester
    to: rolester
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
