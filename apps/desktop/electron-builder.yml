# electron-builder config for the CareerRat desktop shell.
#
# `npm run dist` runs `stage.mjs` first (builds staging/careerrat, the
# extraResources tree below) then electron-builder itself.
#
# Signing: leave `mac.identity` unset so electron-builder uses its standard
# macOS certificate discovery. Local signing credentials belong in the
# builder's keychain or CI signing environment, not in this tracked file.
#
# Notarization: enabled for pilot builds. electron-builder reads Apple
# notarization credentials from the local keychain or CI environment; this
# tracked config intentionally carries no account, team, password, or profile
# values.
appId: com.codeswhat.careerrat
productName: CareerRat
directories:
  output: dist
files:
  - main.mjs
  - atomic-write.mjs
  - desktop-identity.mjs
  - menu-template.mjs
  - desktop-runtime.mjs
  - desktop-routing.mjs
  - desktop-smoke.mjs
  - update-check.mjs
  - window-options.mjs
  - preload/update-check-preload.cjs
  - package.json
extraResources:
  - from: staging/careerrat
    to: careerrat
    filter:
      - "**/*"
      - ".agents/**"
      - "apps/web/dist/**"
      - "!**/.DS_Store"
  # electron-builder's copy filter rejects a root-level `node_modules`
  # directory inside a FileSet, so copy staged runtime dependencies as their
  # own source. The explicit browser filter keeps electron-builder from
  # dropping Playwright's hidden hermetic Chromium directory.
  - from: staging/careerrat/node_modules
    to: careerrat/node_modules
    filter:
      - "**/*"
      - "playwright-core/.local-browsers/**"
      - "!playwright-core/.local-browsers/.links/**"
      - "!@anthropic-ai/claude-agent-sdk"
      - "!@anthropic-ai/claude-agent-sdk/**"
      - "!**/.DS_Store"
mac:
  icon: build/icon.icns
  executableName: CareerRat
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  forceCodeSigning: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  gatekeeperAssess: false
  notarize: true
win:
  icon: build/icon.ico
  executableName: CareerRat
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  artifactName: "${productName}-${version}-win-${arch}-Setup.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CareerRat
  deleteAppDataOnUninstall: false
