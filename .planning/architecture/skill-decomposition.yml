version: "1.0"
phase: "01-decomposition-map"
non_runtime_boundary: "Phase 1 creates planning artifacts only; runtime behavior changes are outside this phase."
classification_buckets:
  deterministic: "Code-owned work with predictable inputs, validation, persistence, scanning, routing, or rendering behavior."
  bounded_ai: "Small schema-validated model calls whose output remains untrusted until deterministic code validates it."
  full_skill_runtime: "Agent-led workflows that still need tool loops, live browser or web search work, human prompts, or nuanced judgment."
  prompt_spec: "Skill prose retained as the human and agent workflow contract for gates, phrasing, and handoffs."
  deferred: "Work intentionally left outside this phase or outside the first app-runtime migration slice."
owner_types:
  existing_ts_module: "A checked-in JavaScript module that owns reusable runtime logic today."
  planned_ts_module: "A future JavaScript module path, prefixed with planned:src/ or planned:scripts/."
  planned_policy: "A named future policy, epic, consent surface, or migration slice that is not yet a module path."
  api_route: "A local HTTP route mounted by tracker-dev or a planned route module."
  db_verb: "A SQLite-backed data or source-config verb that owns durable mutations."
  cli_command: "A CLI surface used by skills, agents, or app routes."
  retained_skill_runtime: "The existing SKILL.md, chat runtime, or skill runtime kept for full agent workflows."
source_decisions:
  D-01: "V1 keeps multiple sourcing lanes in play: cached ATS scans, local public-page extraction, low or free job APIs, crawler tools, AI search or extract, and full skill runtime."
  D-02: "Default order is cheapest-first: existing config, cached board resolution, direct scanner or local scraper, cheap API, crawler, AI search, then full skill runtime."
  D-03: "AI web search is reserved for gaps, ranking, and ambiguous resolution, not routine repeated scans."
  D-04: "Company board resolution should be cached once and reused by later sweeps."
  D-05: "Resolution cache records need company, domain, careers URL, board URL, provider, API URL, confidence, provenance, timestamps, scan result, and failure counters."
  D-06: "Re-resolution should be TTL or event driven by failures, redirects, stale windows, zero-job scans, or explicit refresh."
  D-07: "Public non-job-board pages can use Node fetch first and Playwright for public JS rendering; authenticated browser automation remains v2."
  D-08: "The practical source-design blockers are freshness, disappearing postings, cost, reliability, cacheability, and immediate JD capture."
  D-09: "Every discovered job should preserve the first reachable full JD body locally when found."
  D-10: "Phase 1 specifies a bakeoff across direct scanner/local scraper, low or free job APIs, Firecrawl, AI-search extraction, and optional benchmarks."
  D-11: "The bakeoff measures usable jobs per dollar, JD capture quality, apply-link quality, freshness, duplicates, unsupported pages, failures, and model/tool calls."
  D-12: "Skill files remain human and agent workflow contracts while runtime decomposes them into local APIs, DB verbs, scanners, and bounded AI calls."
  D-13: "discover-companies becomes seed generation or source intake -> deterministic cached resolver -> scanner or extractor -> gate and dedupe -> confirm-first write."
  D-14: "Supported ATS promotion is separate from caching unsupported or custom public career pages for generic extraction."
